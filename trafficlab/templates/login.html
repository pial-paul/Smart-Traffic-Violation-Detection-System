{% extends "base.html" %}
{% block title %}Reviewer sign-in · TrafficLab{% endblock %}
{% block main %}
<main id="main" class="login">
  <h1>Reviewer sign-in</h1>
  <p>Enter your operator token to open the violation review workspace.</p>
  {% if error %}<p role="alert" class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="token">Operator token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
  </form>
</main>
{% endblock %}
