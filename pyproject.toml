[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficlab-review"
version = "0.1.0"
description = "Fixed-camera red-light crossing detection and an evidence review console"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "Flask>=3.1,<4",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<0.4",
  "scipy>=1.13,<2",
  "waitress>=3.0.2,<4",
]

[project.optional-dependencies]
coco = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[project.scripts]
trafficlab = "trafficlab.__main__:main"

[tool.setuptools.packages.find]
include = ["trafficlab*"]

[tool.setuptools.package-data]
trafficlab = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
